# Definición declarativa del servicio en Render (Blueprint).
#
# El servicio actual se creó a mano desde el dashboard, así que Render NO lee
# este archivo todavía: para que empiece a hacerlo hay que conectarlo como
# Blueprint (New > Blueprint) o volver a crear el servicio desde acá. Mientras
# tanto sirve para dos cosas: dejar la configuración versionada en vez de vivir
# sólo en la UI, y poder recrear el servicio idéntico si se pierde.
#
# `healthCheckPath` es el motivo por el que existe este archivo: sin él, un
# deploy que arranca roto se marca como exitoso igual, porque Render no tiene
# forma de preguntarle al servicio si está sano.
services:
  - type: web
    name: backend-emd
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start:prod:seeded
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      # Los secretos (DATABASE_URL, JWT_SECRET, ALLOWED_ORIGINS...) se cargan
      # desde el dashboard y NUNCA se versionan acá.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Almacenamiento de archivos en Cloudflare R2 (docs/storage-r2.md).
      # Sin STORAGE_DRIVER todo sigue en la DB como antes.
      - key: STORAGE_DRIVER
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Monitoreo de errores (docs/monitoring.md). Sin SENTRY_DSN queda apagado.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        sync: false
